<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4TENLAB PLAY | 행운의 돌림판</title><meta name="description" content="모바일에서 바로 사용하는 무료 행운의 돌림판. 이름과 확률을 설정하고 추첨하세요.">
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#172044;background:#f4f6fc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f3f5ff,#fbfcff 60%,#e8f3ff);min-height:100vh}header{max-width:960px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:20px 18px}.brand{font-size:19px;font-weight:900}.brand span{color:#6857eb}.chip{background:white;border-radius:40px;padding:8px 12px;color:#586887;font-size:12px;border:1px solid #e1e7f1}main{width:min(100% - 28px,860px);margin:auto;padding-bottom:40px}.hero{text-align:center;padding:22px 8px 14px}.eyebrow{color:#5847c9;font-size:12px;font-weight:800;background:#eeecff;border-radius:30px;padding:8px 13px;display:inline-block}.hero h1{font-size:clamp(29px,6vw,46px);letter-spacing:-1.4px;margin:16px 0 12px}.hero h1 span{color:#6654ec}.hero p{color:#64748b;line-height:1.7}.features{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:16px auto}.features span{font-size:12px;background:#edf0ff;border-radius:20px;padding:7px 12px;color:#586789}.panel{background:#fff;border:1px solid #e5e9f5;border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 12px 38px #28386212}.wheel-wrap{width:min(100%,390px);aspect-ratio:1;position:relative;margin:16px auto 4px}.wheel-wrap canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 12px #17203626);transition:transform 5s cubic-bezier(.13,.76,.12,1)}.pointer{position:absolute;z-index:2;top:-15px;left:50%;transform:translateX(-50%);font-size:34px;color:#27345b}#result{text-align:center;color:#5845da;font-size:21px;font-weight:850;min-height:42px;margin:18px 0}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}button{border:0;cursor:pointer;border-radius:12px;padding:12px 15px;font-size:14px;font-weight:750;background:#eef0ff;color:#4338ca}button.primary{background:linear-gradient(125deg,#7868ff,#4f49d8);color:white;font-size:17px;padding:14px 32px;box-shadow:0 8px 21px #7568ed52}button:disabled{opacity:.5;cursor:not-allowed}h2{font-size:18px;margin:0 0 13px}.entry{display:flex;align-items:center;gap:8px;margin:8px 0}.entry input{border:1px solid #dce1ee;border-radius:10px;padding:11px;font-size:15px;min-width:0}.name{flex:1}.weight{width:79px}.remove{background:#fff0f0;color:#c43751;padding:11px}.muted{font-size:13px;color:#718096;line-height:1.65}.sum{color:#475569;font-size:14px;font-weight:700;padding:8px 0}footer{text-align:center;font-size:12px;color:#8490a8;padding:15px}@media(max-width:430px){.panel{padding:15px}.entry{gap:5px}.weight{width:68px}.remove{padding:11px 8px}.hero{padding-top:5px}}@media(prefers-reduced-motion:reduce){.wheel-wrap canvas{transition-duration:.01s}}
</style></head>
<body><header><div class="brand">4TEN<span>LAB</span> <small style="font-size:11px;color:#8591a6">PLAY</small></div><div class="chip">✨ 무료 추첨 도구</div></header>
<main><section class="hero"><div class="eyebrow">LUCKY WHEEL · INTERACTIVE EXPERIENCE</div><h1>오늘의 행운을 <span>돌려보세요!</span></h1><p>이벤트부터 팀 활동까지!<br>항목과 확률을 설정하고 버튼 하나로 추첨해 보세요.</p><div class="features"><span>🎯 항목 설정</span><span>⚖️ 확률 조정</span><span>📱 모바일 지원</span></div></section>
<section class="panel"><div class="wheel-wrap"><span class="pointer" aria-hidden="true">▼</span><canvas id="wheel" width="600" height="600" role="img" aria-label="확률 기반 돌림판"></canvas></div><div id="result" aria-live="polite">돌림판을 돌려보세요 🎯</div><div class="actions"><button class="primary" id="spin">🎯 돌리기</button><button id="reset">↺ 처음으로</button></div></section>
<section class="panel"><h2>⚙️ 구역 및 확률 설정</h2><div id="items"></div><div class="sum" id="sum"></div><div class="actions"><button id="add">＋ 구역 추가</button><button id="equal">⚖️ 확률 균등 분배</button></div><p class="muted">확률은 가중치로 계산합니다. 총합이 100이 아니어도 비율대로 추첨됩니다. 0인 항목은 제외됩니다.</p></section>
<footer>© 2026 4TENLAB · 브라우저에서 실행되는 독립형 이벤트 페이지<br>회원가입과 서버 저장 없이 작동합니다.</footer></main>
<script>
(()=>{'use strict';const colors=['#ff7979','#ffd166','#06d6a0','#4cc9f0','#b197fc','#ff9f1c','#f783ac','#74c0fc','#83d483'];const $=id=>document.getElementById(id),items=$('items'),canvas=$('wheel'),ctx=canvas.getContext('2d');let rotation=0,busy=false;
function all(){return [...items.children].map(row=>({name:row.querySelector('.name').value.trim()||'이름 없음',p:Math.max(0,Number(row.querySelector('.weight').value)||0)}))}
function entries(){return all().filter(x=>x.p>0)}
function refresh(){let arr=entries(),sum=arr.reduce((v,x)=>v+x.p,0);$('sum').textContent='총 가중치 '+sum.toLocaleString('ko-KR')+' · 추첨 대상 '+arr.length+'개';$('spin').disabled=busy||!sum;if(busy)return;ctx.clearRect(0,0,600,600);if(!sum){ctx.beginPath();ctx.arc(300,300,278,0,Math.PI*2);ctx.fillStyle='#e2e8f0';ctx.fill();ctx.textAlign='center';ctx.fillStyle='#64748b';ctx.font='bold 24px system-ui';ctx.fillText('구역을 추가해 주세요',300,302);return}let start=-Math.PI/2;arr.forEach((x,i)=>{let size=Math.PI*2*x.p/sum,end=start+size;ctx.beginPath();ctx.moveTo(300,300);ctx.arc(300,300,280,start,end);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();ctx.save();ctx.translate(300,300);ctx.rotate(start+size/2);ctx.fillStyle='#172036';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 20px system-ui';if(size>.17){ctx.fillText(x.name.slice(0,11),177,0,Math.max(36,Math.min(205,size*230)));if(size>.3){ctx.font='15px system-ui';ctx.fillText((100*x.p/sum).toFixed(1)+'%',177,26)}}ctx.restore();start=end});ctx.beginPath();ctx.arc(300,300,34,0,2*Math.PI);ctx.fillStyle='white';ctx.fill();ctx.strokeStyle='#cbd5e1';ctx.lineWidth=5;ctx.stroke();ctx.beginPath();ctx.arc(300,300,13,0,2*Math.PI);ctx.fillStyle='#6254f5';ctx.fill()}
function add(name='',p=10){if(busy)return;const row=document.createElement('div');row.className='entry';const a=document.createElement('input');a.className='name';a.placeholder='구역 이름';a.setAttribute('aria-label','구역 이름');a.value=name;const b=document.createElement('input');b.className='weight';b.type='number';b.min='0';b.step='any';b.value=p;b.setAttribute('aria-label','가중치');const del=document.createElement('button');del.className='remove';del.textContent='삭제';del.addEventListener('click',()=>{if(!busy){row.remove();refresh()}});a.addEventListener('input',refresh);b.addEventListener('input',refresh);row.append(a,b,del);items.append(row);refresh()}
function reset(){if(busy)return;items.replaceChildren();[['행운',25],['축하',25],['선물',25],['다시 도전',25]].forEach(x=>add(...x));rotation=0;canvas.style.transition='none';canvas.style.transform='rotate(0deg)';void canvas.offsetWidth;canvas.style.transition='';$('result').textContent='돌림판을 돌려보세요 🎯'}
function disable(v){document.querySelectorAll('input,button').forEach(x=>x.disabled=v)}
function spin(){if(busy)return;const arr=entries(),sum=arr.reduce((v,x)=>v+x.p,0);if(!sum)return;busy=true;disable(true);$('result').textContent='빙글빙글 돌고 있어요…';const r=Math.random()*sum;let acc=0,idx=arr.length-1;for(let i=0;i<arr.length;i++){if(r<acc+arr[i].p){idx=i;break}acc+=arr[i].p}let targetAngle=360*(acc+arr[idx].p*(.15+Math.random()*.7))/sum,target=((360-targetAngle)%360+360)%360,delta=(target-rotation%360+360)%360;rotation+=360*(5+Math.floor(Math.random()*3))+delta;requestAnimationFrame(()=>canvas.style.transform='rotate('+rotation+'deg)');let done=false;const finish=()=>{if(done)return;done=true;canvas.removeEventListener('transitionend',end);busy=false;disable(false);$('result').textContent='🎉 당첨: '+arr[idx].name;refresh()},end=e=>{if(e.propertyName==='transform')finish()};canvas.addEventListener('transitionend',end);setTimeout(finish,5300)}
$('add').onclick=()=>add('',10);$('equal').onclick=()=>{if(busy)return;const rows=[...items.children];if(!rows.length)return;rows.forEach(row=>row.querySelector('.weight').value=(100/rows.length).toFixed(2));refresh()};$('reset').onclick=reset;$('spin').onclick=spin;reset()})();
</script></body></html>
